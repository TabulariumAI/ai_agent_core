name: AI Agent Core - Build and Deploy Image

on:
  workflow_dispatch:

env:
  SUBSCRIPTION: TabulariumAI
  APP_NAME: ai-agent-core
  APP_VERSION: v1.2.6
  ACR: tabulariumregistry
 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Verify that .env is actually present in the Git checkout
      # before Docker starts building.
      - name: Verify build context
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository files:"
          ls -la

          if [ ! -f .env ]; then
            echo "::error::.env does not exist in the GitHub checkout."
            exit 1
          fi

          if [ ! -s .env ]; then
            echo "::error::.env exists but is empty."
            exit 1
          fi

          echo ".env exists and is not empty."
          echo "Lines: $(wc -l < .env)"
          echo "Bytes: $(wc -c < .env)"


      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CLIENT }}

      - name: Set Azure Subscription
        run: |
          az account set --subscription "$SUBSCRIPTION"

      - name: Get Subscription ID
        id: subscription
        run: |
          echo "SUBSCRIPTION_ID=$(az account show --query id -o tsv)" >> $GITHUB_OUTPUT    

      - name: Get ACR Credentials
        id: acr
        run: |
          echo "ACR_USERNAME=$(az acr credential show --name $ACR --query username -o tsv)" >> $GITHUB_OUTPUT
          echo "ACR_PASSWORD=$(az acr credential show --name $ACR --query "passwords[0].value" -o tsv)" >> $GITHUB_OUTPUT


      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR }}.azurecr.io
          username: ${{ steps.acr.outputs.ACR_USERNAME }}
          password: ${{ steps.acr.outputs.ACR_PASSWORD }}

      - name: Verify image existence
        shell: bash
        run: |
          set -euo pipefail
          REPOSITORY_EXISTS=$(az acr repository list \
            --name "$ACR" \
            --query "[?@=='$APP_NAME']" -o tsv)

          if [ -z "$REPOSITORY_EXISTS" ]; then
            echo "Repository $APP_NAME does not exist yet. Continuing with first image creation."
            exit 0
          fi

          TAG_EXISTS=$(az acr repository show-tags \
            --name "$ACR" \
            --repository "$APP_NAME" \
            --query "[?@=='$APP_VERSION']" -o tsv)

          if [ -n "$TAG_EXISTS" ]; then
            echo "Image $APP_NAME:$APP_VERSION already exists in ACR. Exiting."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.ACR }}.azurecr.io/${{ env.APP_NAME }}:${{ env.APP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Verify the actual image stored in ACR contains /app/.env.
      - name: Verify .env in Docker image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$ACR.azurecr.io/$APP_NAME:$APP_VERSION"

          docker pull "$IMAGE"

          docker run --rm \
            --entrypoint sh \
            "$IMAGE" \
            -c '
              if [ ! -f /app/.env ]; then
                echo "ERROR: /app/.env does not exist."
                exit 1
              fi

              if [ ! -s /app/.env ]; then
                echo "ERROR: /app/.env exists but is empty."
                exit 1
              fi

              echo "/app/.env exists and is not empty."
              echo "Lines: $(wc -l < /app/.env)"
              echo "Bytes: $(wc -c < /app/.env)"
            '

          echo "Docker image verification successful."