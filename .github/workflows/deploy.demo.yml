name: AI Agent Core - Deploy Container App

on:
  workflow_dispatch:

env:
  SUBSCRIPTION: TabulariumAI
  RESOURCE_GROUP: demo
  LOCATION: centralus
  APP_NAME: ai-agent-core
  APP_VERSION: v1.1.9
  ACR: tabulariumregistry
  HOST: demoagentcore.tabulariumai.com
  TARGET_PORT: 3000
  CPU: 0.5
  MEMORY: 1Gi
  MIN_REPLICAS: 1
  MAX_REPLICAS: 10

  CERTIFICATE: cloudflare

  STORAGE_RESOURCE_GROUP: root
  STORAGE_ACCOUNT: tabulariumaidemostorage
  STORAGE_SHARE: share
  STORAGE_TYPE: AzureFile
  STORAGE_NAME: data
  STORAGE_PATH: /mnt/data


  ADDITIONAL_SECRETS: |
    api-key=${{ secrets.API_KEY }}
    batch-container=${{ secrets.BATCH_CONTAINER }}
  ADDITIONAL_VARS: |
    API_KEY=secretRef:api-key
    BATCH_CONTAINER=secretRef:batch-container
    BATCH_URL=https://user.tabulariumai.com/v1
    SESSION_URL=https://document.tabulariumai.com/v1
    INDEX_URL=https://document.tabulariumai.com/v1
    FEEDBACK_URL=https://document.tabulariumai.com/v1
    COMPUTE_URL=https://document.tabulariumai.com/v1
    RECORD_URL=https://document.tabulariumai.com/v1
    REDACT_URL=https://document.tabulariumai.com/v1
    REPROCESS_URL=https://document.tabulariumai.com/v1
    CALLBACK_URL=https://demo.agentcore.tabulariumai.com/callback

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout document-svc
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CLIENT }}

      - name: Set Azure Subscription
        run: |
          az account set --subscription "$SUBSCRIPTION"

      - name: Get Subscription ID
        id: subscription
        run: |
          echo "SUBSCRIPTION_ID=$(az account show --query id -o tsv)" >> $GITHUB_OUTPUT    

      - name: Get ACR Credentials
        id: acr
        run: |
          echo "ACR_USERNAME=$(az acr credential show --name $ACR --query username -o tsv)" >> $GITHUB_OUTPUT
          echo "ACR_PASSWORD=$(az acr credential show --name $ACR --query "passwords[0].value" -o tsv)" >> $GITHUB_OUTPUT
          echo "ACR_SERVER=${{ env.ACR }}.azurecr.io" >> $GITHUB_OUTPUT

      - name: Log in to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ steps.acr.outputs.ACR_SERVER }}
          username: ${{ steps.acr.outputs.ACR_USERNAME }}
          password: ${{ steps.acr.outputs.ACR_PASSWORD }}

      - name: Get Storage Account Key
        id: storage
        run: |
          echo "STORAGE_KEY=$(az storage account keys list --resource-group ${{ env.STORAGE_RESOURCE_GROUP }} --account-name ${{ env.STORAGE_ACCOUNT }} --query "[0].value" -o tsv)" >> $GITHUB_OUTPUT

      - name: Verify image existence
        id: image
        run: |
          TAG_EXISTS=$(az acr repository show-tags \
            --name "$ACR" \
            --repository ${{ env.APP_NAME }} \
            --query "[?@=='${{ env.APP_VERSION }}']" -o tsv)

          if [ -z "$TAG_EXISTS" ]; then
            echo "Image ${{ env.APP_NAME }}:${{ env.APP_VERSION }} does not exist in ACR. Exiting."
            exit 1
          fi
          echo "IMAGE_NAME=${{ env.APP_NAME }}:${{ env.APP_VERSION }}" >> $GITHUB_OUTPUT

      - name: Create Resource Group if not exists
        run: |
          az group create --name ${{ env.RESOURCE_GROUP }} --location ${{ env.LOCATION }} || true

      - name: Create Log Analytics Workspace (if not exists)
        id: workspace
        run: |
          WORKSPACE_NAME=${{ env.APP_NAME }}-log
          az monitor log-analytics workspace create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --workspace-name $WORKSPACE_NAME || true
          echo "WORKSPACE_NAME=$WORKSPACE_NAME" >> $GITHUB_OUTPUT

      - name: Get Log Analytics Information
        id: loganalytics
        run: |
          echo "WORKSPACE_ID=$(az monitor log-analytics workspace show --resource-group ${{ env.RESOURCE_GROUP }} --workspace-name ${{ steps.workspace.outputs.WORKSPACE_NAME }} --query customerId -o tsv)" >> $GITHUB_OUTPUT
          echo "WORKSPACE_KEY=$(az monitor log-analytics workspace get-shared-keys --resource-group ${{ env.RESOURCE_GROUP }} --workspace-name ${{ steps.workspace.outputs.WORKSPACE_NAME }} --query primarySharedKey -o tsv)" >> $GITHUB_OUTPUT

      - name: Create/Update Container App Environment
        id: env  
        run: |
          ENV_NAME=${{ env.APP_NAME }}-env
          
          ENV_ID=$(az containerapp env show \
            --name $ENV_NAME \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query id -o tsv 2>/dev/null || \
          az containerapp env create \
            --name $ENV_NAME \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --location ${{ env.LOCATION }} \
            --logs-destination log-analytics \
            --logs-workspace-id ${{ steps.loganalytics.outputs.WORKSPACE_ID }} \
            --logs-workspace-key ${{ steps.loganalytics.outputs.WORKSPACE_KEY }} \
            --query id -o tsv)
          
          az containerapp env storage set \
            --name $ENV_NAME \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --storage-name ${{ env.STORAGE_NAME }} \
            --azure-file-account-name ${{ env.STORAGE_ACCOUNT }} \
            --azure-file-account-key ${{ steps.storage.outputs.STORAGE_KEY }} \
            --azure-file-share-name ${{ env.STORAGE_NAME }} \
            --access-mode ReadWrite

          echo "ENV_ID=$ENV_ID" >> $GITHUB_OUTPUT
          echo "ENV_NAME=$ENV_NAME" >> $GITHUB_OUTPUT

      - name: Upload Certificate to Environment if Not Exists
        id: cert
        run: |
          set -e
          CERT_EXISTS=$(az containerapp env certificate list \
            -g ${{ env.RESOURCE_GROUP }} \
            --name ${{ steps.env.outputs.ENV_NAME }} \
            --query "[?name=='${{env.CERTIFICATE}}'] | length(@)" -o tsv)
          
          if [ "$CERT_EXISTS" -eq "0" ]; then
            echo "${{ secrets.CLOUDFLARE_CERT }}" | base64 -d > ${{env.CERTIFICATE}}.pfx
            az containerapp env certificate upload \
              -g ${{ env.RESOURCE_GROUP }} \
              --name ${{ steps.env.outputs.ENV_NAME }} \
              --certificate-file ${{env.CERTIFICATE}}.pfx \
              --password "${{ secrets.CLOUDFLARE_CERT_PASS }}" \
              --certificate-name ${{env.CERTIFICATE}}
          fi
          
          CERTIFICATE_ID=$(az containerapp env certificate list \
            -g ${{ env.RESOURCE_GROUP }} \
            --name ${{ steps.env.outputs.ENV_NAME }} \
            --query "[?name=='${{env.CERTIFICATE}}'].id | [0]" -o tsv)
          echo "CERTIFICATE_ID=$CERTIFICATE_ID" >> $GITHUB_OUTPUT

      - name: Generate container app yaml from template
        run: |
      
          export LOCATION="${{ env.LOCATION }}"
          export SUBSCRIPTION_ID="${{ steps.subscription.outputs.SUBSCRIPTION_ID }}"
          export APP_NAME="${{ env.APP_NAME }}"
          export ENV_ID="${{ steps.env.outputs.ENV_ID }}"
          export ACR_SERVER="${{ steps.acr.outputs.ACR_SERVER }}"
          export ACR_USERNAME="${{ steps.acr.outputs.ACR_USERNAME }}"
          export ACR_PASSWORD="${{ steps.acr.outputs.ACR_PASSWORD }}"
          export IMAGE_NAME="${{ steps.image.outputs.IMAGE_NAME }}"
          export STORAGE_TYPE="${{ env.STORAGE_TYPE }}"
          export STORAGE_NAME="${{ env.STORAGE_NAME }}"
          export STORAGE_PATH="${{ env.STORAGE_PATH }}"
          export TARGET_PORT="${{ env.TARGET_PORT }}"
          export CPU="${{ env.CPU }}"
          export MEMORY="${{ env.MEMORY }}"
          export MIN_REPLICAS="${{ env.MIN_REPLICAS }}"
          export MAX_REPLICAS="${{ env.MAX_REPLICAS }}"

          envsubst < container.yml.txt > container.yml

          while IFS= read -r VAR; do
            [[ -z "$VAR" ]] && continue
            VAR_NAME="${VAR%%=*}"
            VAR_VALUE="${VAR#*=}"
            yq -i ".properties.configuration.secrets += [{\"name\": \"$VAR_NAME\", \"value\": \"$VAR_VALUE\"}]" container.yml
          done <<< "${{ env.ADDITIONAL_SECRETS }}"

          while IFS= read -r VAR; do
            [[ -z "$VAR" ]] && continue
            VAR_NAME="${VAR%%=*}"
            VAR_VALUE="${VAR#*=}"
            if [[ "$VAR_VALUE" == secretRef:* ]]; then
              VAR_VALUE="${VAR_VALUE#secretRef:}"
              yq -i ".properties.template.containers[0].env += [{\"name\": \"$VAR_NAME\", \"secretRef\": \"$VAR_VALUE\"}]" container.yml
            else
              yq -i ".properties.template.containers[0].env += [{\"name\": \"$VAR_NAME\", \"value\": \"$VAR_VALUE\"}]" container.yml
            fi
          done <<< "${{ env.ADDITIONAL_VARS }}"

          echo "Generated container.yml:"
          cat container.yml


      - name: Deploy Container App
        run: |
          if az containerapp show --name ${{ env.APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} &>/dev/null; then
            echo "Container App ${{ env.APP_NAME }} exists — updating..."
            az containerapp update \
              --name ${{ env.APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --yaml container.yml
          else
            echo "Container App ${{ env.APP_NAME }} does not exist — creating..."
            az containerapp create \
              --name ${{ env.APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --yaml container.yml
          fi          

      # - name: Set CORS for Container App
      #   run: |
      #     az containerapp ingress cors update \
      #       --name ${{ env.APP_NAME }} \
      #       --resource-group ${{ env.RESOURCE_GROUP }} \
      #       --allowed-origins ${{ env.CORS_ORIGINS }} \
      #       --allowed-methods ${{ env.CORS_METHODS }} \
      #       --allowed-headers ${{ env.CORS_HEADERS }}

      - name: Bind Custom Domains
        run: |
          DOMAINS="${{ env.HOST }}"
          for DOMAIN in $DOMAINS; do
            echo "Processing domain: $DOMAIN"
            HOST_EXISTS=$(az containerapp hostname list \
              -g ${{ env.RESOURCE_GROUP }} \
              -n ${{ env.APP_NAME }} \
              --query "[?name=='$DOMAIN'] | length(@)" -o tsv)
            if [ "$HOST_EXISTS" -eq "0" ]; then
              echo "Binding domain $DOMAIN to app..."
              az containerapp hostname bind \
                --hostname $DOMAIN \
                -g ${{ env.RESOURCE_GROUP }} \
                -n ${{ env.APP_NAME }} \
                --environment ${{ steps.env.outputs.ENV_NAME }} \
                --certificate ${{ env.CERTIFICATE }}
            else
              echo "Domain $DOMAIN already bound to app. Skipping."
            fi
          done
